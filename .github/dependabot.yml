version: 2
updates:

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    commit-message:
      prefix: "[dependabot]"

    # Intensity
    open-pull-requests-limit: 10
    schedule:
      interval: monthly

  - package-ecosystem: npm
    directory: /
    target-branch: develop
    versioning-strategy: increase
    commit-message:
      prefix: "[dependabot]"

    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

    # Intensity
    open-pull-requests-limit: 10
    schedule:
      interval: monthly
    groups:
      # Runs in CI (can just merge)
      type-dependencies:
        applies-to: version-updates
        patterns: ["typescript" , "@types/*" , "ts-node" , "@typescript-eslint/*"]
      eslint-dependencies:
        applies-to: version-updates
        patterns: ["eslint" , "eslint-*" , "prettier"]
      jest-dependencies:
        applies-to: version-updates
        patterns: ["jest" , "jest-*" , "@testing-library/*"]
      # Build (some risk of faulty build)
      babel-dependencies:
        applies-to: version-updates
        patterns: ["@babel/*" , "babel-*"]
      webpack-dependencies:
        applies-to: version-updates
        patterns: ["webpack" , "webpack-*" , "*-webpack-plugin"]
